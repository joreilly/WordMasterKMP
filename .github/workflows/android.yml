name: Android CI

on:
  pull_request:
  push:
    branches: [ main ]

# Cancel superseded runs for the same PR/branch
concurrency:
  group: android-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Android client
        run: ./gradlew assembleDebug
      - name: Run shared tests
        run: ./gradlew :shared:jvmTest

  # Launch the app on an emulator and run the gekko UI tests shared with the iOS app
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      # Without this the runner user can't open /dev/kvm, so the emulator falls back to
      # unaccelerated software emulation, which is slow and flaky (APK installs time out).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build android app
        run: ./gradlew :androidApp:assembleDebug

      - name: Setup gekko
        uses: jakala-germany/setup-gekko-cli-action@2aacfecac33551097b0c7b86ad57d4f59c9f5ad4 # 1.3.0
        with:
          version: 1.3.0

      - name: Run gekko tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gekko run --project gekko --platform android --install --record failures --output gekko-results

      # Screenshots of the tests, plus video and view hierarchy of failed ones
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gekko-results-android
          path: gekko-results
